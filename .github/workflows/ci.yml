name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Python Syntax & Bytecode Compilation
      run: |
        python -m py_compile extract_resumes.py

    - name: Run Demo Sample Candidate Generation
      run: |
        python extract_resumes.py --create-sample

    - name: Execute End-to-End Extraction Pipeline
      run: |
        python extract_resumes.py --folder candidate_sample --output test_out

    - name: Verify Output Spreadsheets Generated
      shell: python
      run: |
        import os, sys, pandas as pd, openpyxl
        assert os.path.exists('test_out.csv'), 'CSV output missing!'
        assert os.path.exists('test_out.xlsx'), 'Excel output missing!'
        df = pd.read_csv('test_out.csv')
        assert len(df) >= 3, f'Expected at least 3 candidates, found {len(df)}'
        wb = openpyxl.load_workbook('test_out.xlsx')
        assert 'Candidates' in wb.sheetnames, 'Candidates sheet missing!'
        print(f'CI SUCCESS: Verified {len(df)} extracted candidate records.')
